# Two native host builds. scripts/launch-coreelec.sh requires GS-King X /
# CoreELEC. CI runs it only through scripts/test-launch-coreelec.sh
# (a stand-in runtime, then the packaged AppImage against mosquitto).
#
# - ubuntu-24.04: x86_64 host/Codespaces smoke AppImage
# - ubuntu-24.04-arm: native aarch64 smoke AppImage built against Ubuntu's
#   FFmpeg. This is NOT a GS-King X binary for either CoreELEC line. The
#   device AppImages (CoreELEC 21 Amlogic-ng armv7hf, CoreELEC 22 Amlogic-no
#   aarch64) are cross-built against CoreELEC sysroots in
#   .github/workflows/coreelec-appimage.yml.
#
# Both runners execute the player and the unit tests natively. The x86_64
# runner also uploads the Kodi add-on zip (kodi-addon/), which launches
# scripts/launch-coreelec.sh on the device and does not contain a player.

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    env:
      CMAKE_BUILD_TYPE: Release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'tests/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.arch }}-

      - name: Cache AppImage tools
        uses: actions/cache@v6
        with:
          path: .cache/appimage-tools
          key: appimage-tools-${{ runner.os }}-${{ matrix.arch }}-v1

      # Library list matches .devcontainer/Dockerfile, plus ccache, the
      # ffmpeg CLI (ffmpeg_decoder_tests synthesizes a local fixture), and
      # mosquitto (the packaged AppImage launch-script check). squashfs-tools
      # is for the kodi_addon device AppImage marker check.
      # layout_engine_tests itself only needs a C++ compiler.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            ca-certificates \
            ccache \
            cmake \
            curl \
            ffmpeg \
            file \
            g++ \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libdrm-dev \
            libfuse2t64 \
            libmosquitto-dev \
            libswscale-dev \
            busybox-static \
            mosquitto \
            patchelf \
            pkg-config \
            squashfs-tools

      # The install step above provides libav*, libmosquitto, libdrm, and the
      # ffmpeg CLI. AMS_REQUIRE_DECODER_TESTS makes a green run that never
      # executed ffmpeg_decoder, present_smoke, or stream_player_http fail.
      - name: Run unit tests
        env:
          AMS_REQUIRE_DECODER_TESTS: "1"
        run: ./scripts/run-tests.sh

      - name: Build AppImage
        run: ./scripts/build-appimage.sh

      - name: Check AppImage architecture
        run: |
          set -euo pipefail
          mapfile -t images < <(find dist -maxdepth 1 -type f -name '*.AppImage' | sort)
          if [[ "${#images[@]}" -ne 1 ]]; then
            echo "expected one AppImage, found ${#images[@]}" >&2
            printf '%s\n' "${images[@]}" >&2
            exit 1
          fi
          name="$(basename "${images[0]}")"
          case "$name" in
            *-"${{ matrix.arch }}".AppImage) ;;
            *)
              echo "expected ${{ matrix.arch }} in ${name}" >&2
              exit 1
              ;;
          esac
          file "${images[0]}"
          if [[ "${{ matrix.arch }}" == "aarch64" ]]; then
            file "${images[0]}" | grep -E -i -q 'aarch64'
          else
            file "${images[0]}" | grep -E -i -q 'x86-64|x86_64'
          fi

      - name: Launch script against the AppImage
        run: |
          set -euo pipefail
          image=$(find dist -maxdepth 1 -type f -name '*.AppImage' | head -n 1)
          test -n "$image"
          ./scripts/test-launch-coreelec.sh --only-appimage --appimage "$image" --bare build/amlogic-multistream

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: amlogic-multistream-appimage-${{ matrix.arch }}
          path: dist/*.AppImage
          if-no-files-found: error
          compression-level: 0

      # The add-on zip is architecture independent and does not contain the
      # player, so one runner is enough. ctest (kodi_addon) already checked
      # its contents above.
      - name: Package Kodi add-on
        if: matrix.arch == 'x86_64'
        run: ./scripts/package-kodi-addon.sh --out dist/kodi-addon

      - name: Upload Kodi add-on
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: plugin.program.amlogic-multistream
          path: dist/kodi-addon/*.zip
          if-no-files-found: error
          compression-level: 0
